<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715.39 732.14" role="img" aria-labelledby="t">
  <title id="t">Study OS</title>
  <defs>
    <path id="squircle" d="M380,78H645C830.6,78 935,182.4 935,368V645C935,830.6 830.6,935 645,935H380C194.4,935 90,830.6 90,645V368C90,182.4 194.4,78 380,78Z"/>
    <clipPath id="cPlate"><use href="#squircle"/></clipPath>

    <!-- Moldura e placa -->
    <linearGradient id="gFrame" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="935" y2="0">
      <stop offset="0" stop-color="#4a6cff"/>
      <stop offset="0.45" stop-color="#8f4dff"/>
      <stop offset="0.8" stop-color="#e03cd2"/>
      <stop offset="1" stop-color="#ff3a9c"/>
    </linearGradient>
    <linearGradient id="gPlate" gradientUnits="userSpaceOnUse" x1="90" y1="78" x2="935" y2="935">
      <stop offset="0" stop-color="#0d0b1c"/>
      <stop offset="1" stop-color="#120a1f"/>
    </linearGradient>

    <!-- Órbitas -->
    <linearGradient id="gOrbit" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="850" y2="0">
      <stop offset="0" stop-color="#5a50f2"/>
      <stop offset="0.5" stop-color="#9448f5"/>
      <stop offset="1" stop-color="#ff32b0"/>
    </linearGradient>
    <linearGradient id="gOrbitV" gradientUnits="userSpaceOnUse" x1="362" y1="200" x2="670" y2="800">
      <stop offset="0" stop-color="#5a5aff"/>
      <stop offset="0.45" stop-color="#a24fff"/>
      <stop offset="1" stop-color="#c84dff"/>
    </linearGradient>

    <!-- Livro -->
    <linearGradient id="gPageL" gradientUnits="userSpaceOnUse" x1="322" y1="380" x2="508" y2="610">
      <stop offset="0" stop-color="#6e8cff"/>
      <stop offset="0.5" stop-color="#8a5cf2" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#5a30b8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2c1760" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="gPageR" gradientUnits="userSpaceOnUse" x1="516" y1="560" x2="702" y2="380">
      <stop offset="0" stop-color="#3a1f7e" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#a84dff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff62e4"/>
    </linearGradient>
    <linearGradient id="gCover" gradientUnits="userSpaceOnUse" x1="292" y1="0" x2="732" y2="0">
      <stop offset="0" stop-color="#5f80ff"/>
      <stop offset="0.5" stop-color="#9b52ff"/>
      <stop offset="1" stop-color="#ff4fd0"/>
    </linearGradient>
    <linearGradient id="gTerm" gradientUnits="userSpaceOnUse" x1="460" y1="0" x2="570" y2="0">
      <stop offset="0" stop-color="#d44dff"/>
      <stop offset="1" stop-color="#ff60e0"/>
    </linearGradient>

    <!-- Elétrons -->
    <radialGradient id="gElecTR" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f5c6ff"/>
      <stop offset="0.55" stop-color="#c76bff"/>
      <stop offset="1" stop-color="#a14dff"/>
    </radialGradient>
    <radialGradient id="gElecBL" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#bcbdff"/>
      <stop offset="0.55" stop-color="#7b72ff"/>
      <stop offset="1" stop-color="#5a4cff"/>
    </radialGradient>

    <!-- Brilhos -->
    <filter id="fGlow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fSmallGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fFrameGlow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  
    <linearGradient id="gOS" gradientUnits="userSpaceOnUse" x1="465.36" y1="0" x2="648.19" y2="0">
      <stop offset="0" stop-color="#6f66ff"/>
      <stop offset="0.55" stop-color="#b24fff"/>
      <stop offset="1" stop-color="#ff3eb5"/>
    </linearGradient>
  </defs>

  <g id="symbol" transform="translate(144.58,67.2) scale(0.62315) translate(-170,-148)">
  <g id="orbits" fill="none" stroke-width="18" stroke-linecap="round" filter="url(#fGlow)" opacity="0.82">
    <ellipse cx="512" cy="485" rx="146" ry="328" stroke="url(#gOrbitV)"/>
    <path stroke="url(#gOrbit)" d="M831,648.8A352,145 25 0 1 193,351.2A352,145 25 0 1 831,648.8Z"/>
    <path stroke="url(#gOrbit)" d="M831,351.2A352,145 -25 0 1 193,648.8A352,145 -25 0 1 831,351.2Z"/>
  </g>

  <!-- Livro aberto -->
  <g id="book">
    <path id="cover" fill="none" stroke="url(#gCover)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" filter="url(#fSmallGlow)"
          d="M292,394V566C292,574 297,580 306,583C380,602 456,640 506,686Q512,692 518,686C568,640 644,602 718,583C727,580 732,574 732,566V394"/>
    <path id="page-left" fill="url(#gPageL)"
          d="M322,376C322,362 334,352 350,357C420,372 480,396 508,436L508,648C450,606 380,578 338,548C326,540 322,532 322,520Z"/>
    <path id="page-right" fill="url(#gPageR)"
          d="M702,376C702,362 690,352 674,357C604,372 544,396 516,436L516,648C574,606 644,578 686,548C698,540 702,532 702,520Z"/>
  </g>

  <!-- Terminal -->
  <g id="terminal">
    <rect x="440" y="436" width="146" height="112" rx="22" fill="#07061a" opacity="0.4"/>
    <g fill="none" stroke="url(#gTerm)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#fSmallGlow)">
      <path d="M466,460L496,490L466,520"/>
      <path d="M520,520H562"/>
    </g>
  </g>

  <!-- Elétrons -->
  <g id="electrons" filter="url(#fSmallGlow)">
    <circle cx="708" cy="291" r="30" fill="url(#gElecTR)"/>
    <circle cx="282" cy="700" r="32" fill="url(#gElecBL)"/>
  </g>
</g>

